<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ali Hassan | International Relations & Youth Empowerment</title>

<meta name="description"
content="Ali Hassan — BS International Relations student from Sargodha, Pakistan, interested in global affairs, youth empowerment, public service and agriculture.">

<style>
:root{
  --navy:#071b33;
  --blue:#1565c0;
  --sky:#42a5f5;
  --gold:#e4b44c;
  --white:#ffffff;
  --bg:#f5f8fc;
  --text:#17212b;
  --muted:#66768a;
  --border:#dce5ee;
  --shadow:0 15px 45px rgba(7,27,51,.10);
  --radius:20px;
}

*{
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}

/* NAVBAR */

nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(7,27,51,.96);
  color:white;
  backdrop-filter:blur(10px);
}

.nav-inner{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.logo span{
  color:var(--gold);
}

.nav-links{
  display:flex;
  gap:25px;
}

.nav-links a{
  color:#dbe8f5;
  font-size:14px;
}

.nav-links a:hover{
  color:white;
}

.menu{
  display:none;
  background:none;
  border:1px solid #ffffff44;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  font-size:20px;
}

/* HERO */

.hero{
  background:
  radial-gradient(circle at 80% 20%,#1976d244,transparent 30%),
  linear-gradient(135deg,#071b33,#10385d);
  color:white;
  padding:90px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:60px;
  align-items:center;
}

.badge-top{
  display:inline-block;
  padding:8px 15px;
  border:1px solid #ffffff33;
  border-radius:50px;
  color:#dbeaff;
  background:#ffffff0d;
}

h1{
  font-size:clamp(45px,7vw,85px);
  line-height:1;
  margin:20px 0;
}

h1 span{
  color:var(--gold);
}

.hero-text{
  max-width:700px;
  color:#d7e6f5;
  font-size:18px;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:30px;
}

.btn{
  padding:12px 20px;
  border-radius:10px;
  font-weight:bold;
  display:inline-block;
}

.btn-primary{
  background:var(--gold);
  color:#16202a;
}

.btn-outline{
  border:1px solid #ffffff44;
  color:white;
}

/* PROFILE IMAGE */

.profile{
  background:#ffffff14;
  padding:10px;
  border:1px solid #ffffff22;
  border-radius:25px;
}

.profile img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  border-radius:18px;
}

/* SECTIONS */

section{
  padding:80px 0;
}

.section-title{
  margin-bottom:35px;
}

.kicker{
  color:var(--blue);
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:13px;
}

h2{
  font-size:42px;
  line-height:1.1;
  margin:8px 0;
}

.section-title p{
  color:var(--muted);
}

/* CARDS */

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  box-shadow:var(--shadow);
}

.facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.fact{
  background:#f1f6fb;
  padding:15px;
  border-radius:13px;
}

.fact strong{
  display:block;
  color:var(--navy);
}

.fact span{
  color:var(--muted);
  font-size:14px;
}

/* PILLS */

.pills{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.pill{
  background:#edf5fd;
  color:#174d7d;
  border:1px solid #d8e8f6;
  padding:9px 13px;
  border-radius:50px;
  font-size:14px;
  font-weight:bold;
}

/* TIMELINE */

.timeline{
  position:relative;
}

.timeline:before{
  content:"";
  position:absolute;
  left:8px;
  top:5px;
  bottom:5px;
  width:2px;
  background:#d8e4ef;
}

.timeline-item{
  position:relative;
  padding-left:35px;
  margin-bottom:30px;
}

.timeline-item:before{
  content:"";
  position:absolute;
  left:1px;
  top:8px;
  width:15px;
  height:15px;
  background:var(--blue);
  border-radius:50%;
  box-shadow:0 0 0 5px #e5f0fb;
}

.timeline-item h3{
  margin:0 0 5px;
}

.timeline-item .year{
  color:var(--blue);
  font-weight:bold;
  font-size:14px;
}

/* VISION */

.vision{
  background:var(--navy);
  color:white;
}

.vision .section-title p{
  color:#c8d8e8;
}

.vision-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.vision-card{
  padding:28px;
  border:1px solid #ffffff1c;
  background:#ffffff09;
  border-radius:18px;
}

.vision-card .icon{
  font-size:35px;
}

.vision-card p{
  color:#cbd9e7;
}

/* RESULTS */

.result-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.result-card{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  box-shadow:var(--shadow);
}

.result-number{
  font-size:35px;
  font-weight:800;
  color:var(--navy);
}

.result-label{
  color:var(--muted);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:14px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{
  background:#f2f6fa;
  color:var(--navy);
}

/* CERTIFICATES */

.cert-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.cert{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.cert img{
  width:100%;
  height:300px;
  object-fit:cover;
  object-position:top;
}

.cert-content{
  padding:18px;
}

.cert-content h3{
  margin:0;
}

.cert-content p{
  color:var(--muted);
  font-size:14px;
}

/* CONTACT */

.contact{
  background:#eaf1f7;
}

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.contact-item{
  background:white;
  border:1px solid var(--border);
  padding:18px;
  border-radius:14px;
  margin-bottom:12px;
}

.contact-item small{
  display:block;
  color:var(--muted);
}

.contact-item a{
  color:var(--blue);
  font-weight:bold;
}

/* FOOTER */

footer{
  background:#041426;
  color:#b9c8d8;
  padding:30px 0;
  text-align:center;
}

/* MOBILE */

@media(max-width:850px){

  .hero-grid,
  .grid-2,
  .result-box,
  .contact-grid{
    grid-template-columns:1fr;
  }

  .vision-grid,
  .cert-grid{
    grid-template-columns:1fr 1fr;
  }

  .nav-links{
    display:none;
    position:absolute;
    top:70px;
    left:0;
    right:0;
    background:var(--navy);
    padding:20px;
    flex-direction:column;
  }

  .nav-links.active{
    display:flex;
  }

  .menu{
    display:block;
  }
}

@media(max-width:550px){

  section{
    padding:60px 0;
  }

  h2{
    font-size:32px;
  }

  .facts,
  .vision-grid,
  .cert-grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding:65px 0;
  }

}
</style>
</head>

    <a href="#home
