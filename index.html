
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ali Hassan | Personal Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
            line-height: 1.7;
        }

        nav {
            background: #0b2545;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav ul li a:hover {
            color: #8ecae6;
        }

        .hero {
            min-height: 90vh;
            background: linear-gradient(135deg, #0b2545, #134074);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 8%;
        }

        .hero-content {
            max-width: 1100px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .hero-text h2 {
            font-size: 28px;
            color: #8ecae6;
            margin-bottom: 20px;
        }

        .hero-text p {
            font-size: 18px;
            max-width: 650px;
        }

        .profile-image {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid white;
            background: white;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: white;
            color: #0b2545;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        section {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .section-title {
            text-align: center;
            color: #0b2545;
            font-size: 34px;
            margin-bottom: 35px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h3 {
            color: #134074;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .education-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .education-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .education-card h3 {
            color: #0b2545;
            margin-bottom: 12px;
        }

        .result-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .result {
            background: #eef5fb;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
        }

        .result h3 {
            font-size: 32px;
            color: #0b2545;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .skill {
            background: #0b2545;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
        }

        .goals {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .goal {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .goal h3 {
            color: #134074;
            margin-bottom: 8px;
        }

        footer {
            background: #0b2545;
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 60px;
        }
